events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server {
        listen 80;
        server_name _;
        return 301 https://$host:4321$request_uri;
    }
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        set $project1_api project1-v2-backend:8000;
        location / { root /usr/share/nginx/html; index index.html; try_files $uri $uri/ /index.html; }
        location /api/ {
            proxy_pass http://$project1_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /health { proxy_pass http://$project1_api; }
    }
}
